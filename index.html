#scan{position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,rgba(255,255,255,0) 1px 5px)}

@keyframes gngPulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes gngDrift{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-18px,0)}100%{transform:translate3d(0,0,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- left / hero ---------- */
.left{position:relative;padding:80px 72px 72px 88px;display:flex;flex-direction:column;justify-content:space-between}
.hero-top{display:flex;flex-direction:column;gap:44px}
.logo{height:260px;width:auto;object-fit:contain;object-position:left center;animation:gngDrift 7s ease-in-out infinite}
.kicker{font:500 26px 'JetBrains Mono',monospace;color:var(--cyan);letter-spacing:.24em;text-transform:uppercase}
.hero-name{margin-top:18px;font:800 132px/.9 'Poppins',sans-serif;color:#fff;letter-spacing:-.035em}
.hero-name.small{font-size:104px}
.hero-name.tiny{font-size:82px}
.pills{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;min-height:64px}
.pill{padding:12px 24px;border-radius:999px;font:500 24px 'DM Sans',sans-serif;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#cfe2f2}
.pill.ready{border-color:rgba(47,224,138,.4);background:rgba(47,224,138,.12);color:#8ff0c0}
.pill.waking{border-color:rgba(255,201,30,.45);background:rgba(255,201,30,.12);color:#ffdd7a}
.pill.down{border-color:rgba(255,120,90,.45);background:rgba(255,120,90,.12);color:#ffb3a0}
.cta{display:flex;align-items:center;gap:20px}
.okkey{display:grid;place-items:center;padding:20px 38px;border-radius:16px;background:var(--gold);
  color:var(--navy);font:700 32px 'Poppins',sans-serif;cursor:pointer;user-select:none;
  transition:transform .12s ease,box-shadow .12s ease}
.okkey:active{transform:scale(.95)}
.okkey.armed{box-shadow:0 0 0 6px rgba(255,201,30,.25)}
.cta-text{font:400 30px 'DM Sans',sans-serif;color:#cfe2f2}
.cta-hint{margin-left:26px;font:400 26px 'DM Sans',sans-serif;color:var(--dim2)}

/* ---------- right / list ---------- */
.right{position:relative;padding:70px 88px 60px 40px;display:flex;flex-direction:column;gap:16px;
  border-left:1px solid rgba(255,255,255,.10);background:rgba(0,20,52,.35)}
.right h2{font:600 28px 'Poppins',sans-serif;color:#fff}
#list{display:flex;flex-direction:column;gap:16px}
.tile{display:flex;align-items:center;gap:22px;padding:26px 34px;border-radius:20px;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);
  transition:background .15s ease,border-color .15s ease,transform .15s ease}
.tile:focus{outline:none}
.tile.sel{background:linear-gradient(120deg,rgba(0,145,187,.24),rgba(0,145,187,.06));
  border:2px solid var(--cyan);padding:25px 33px;transform:scale(1.015)}
.tile .title{font:700 44px 'Poppins',sans-serif;color:#e8f2fa;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tile.sel .title{color:#fff}
.tile .state{margin-top:6px;display:flex;align-items:center;gap:9px;
  font:500 20px 'JetBrains Mono',monospace;color:var(--dim)}
.dot{width:10px;height:10px;border-radius:50%;background:#5b7893;flex:0 0 auto}
.dot.checking{background:var(--gold);animation:gngPulse 1.8s ease-in-out infinite}
.dot.ready{background:var(--green)}
.dot.woke{background:var(--gold)}
.dot.down{background:#e06a4a}
.foot{margin-top:auto;padding-top:28px;border-top:1px solid rgba(255,255,255,.10);
  font:400 22px/1.5 'DM Sans',sans-serif;color:var(--dim2)}
</style>
</head>

        <span class="cta-hint">↑ ↓ to browse the night's lineup</span>
      </div>
    </div>

    <div class="right">
      <h2>Available games</h2>
      <div id="list"></div>
      <div class="foot">Alt + ← returns here from any board · cold boards wake in 30–60s · boards are display-only, no login</div>
    </div>
  </div>
</div>

<script>
/* ==================================================================
   EDIT THIS BLOCK ONLY.
   Confirm each origin against the live site before your first pub run.
   ================================================================== */
var GAMES = [
  { name: "Survey Says", line1: "Survey", line2: "Says",  origin: "https://survey-says.gamenightguild.app" },
  { name: "Linked Up",   line1: "Linked", line2: "Up",    origin: "https://linked-up.gamenightguild.app" },
  { name: "Off the Top", line1: "Off the", line2: "Top",  origin: "https://off-the-top.gamenightguild.app" },
  { name: "Trivia",      line1: "Trivia", line2: "",      origin: "https://trivia.gamenightguild.app" },

  // Tournaments serves its board at /board, not /tv/board, so it overrides the
  // default with its own path. Add "?venue=2" here when you need one venue's
  // screens instead of the combined board. ORIGIN IS A PLACEHOLDER - confirm it.
  { name: "Tournaments", line1: "Tournaments", line2: "",
    origin: "https://gng-tournaments.gamenightguild.app", path: "/board" }
];
var BOARD_PATH   = "/tv/board";   // default; a game can override with "path"
var WARM_CUTOFF  = 8000;    // ms — slower than this means the service was asleep
var PROBE_TIMEOUT= 75000;   // ms — give a cold Render dyno time to boot
var REPING_EVERY = 300000;  // ms — re-ping every 5 min so nothing sleeps mid-night
/* ================================================================== */

function boardPath(g) { return g.path || BOARD_PATH; }

var listEl   = document.getElementById('list');
var heroName = document.getElementById('heroName');
var heroPill = document.getElementById('heroPill');
var ctaText  = document.getElementById('ctaText');
var sel = 0;

/* ---- build the tiles ---- */
for (var i = 0; i < GAMES.length; i++) {
  var g = GAMES[i];
  var tile = document.createElement('div');
  tile.className = 'tile';
  tile.id = 'tile-' + i;
  tile.tabIndex = 0;

  var box = document.createElement('div');
  box.style.minWidth = '0';

  var t = document.createElement('div');
  t.className = 'title';
  t.textContent = g.name;

  var s = document.createElement('div');
  s.className = 'state';
  var dot = document.createElement('span');
  dot.className = 'dot checking';
  dot.id = 'dot-' + i;
  var txt = document.createElement('span');
  txt.id = 'state-' + i;
  txt.textContent = 'Checking server…';
  s.appendChild(dot); s.appendChild(txt);

  box.appendChild(t); box.appendChild(s);
  tile.appendChild(box);
  listEl.appendChild(tile);

  (function (idx) {
    // Selecting a tile only changes what's 'up next' on the left.
    // Launching is the OK button / remote select, never the tile itself.
    tile.addEventListener('click', function () { select(idx); });
    tile.addEventListener('focus', function () { select(idx); });
  })(i);
}

/* ---- svcStatus model ---- */
var svcStatus = [];   // {cls, short, long} per game
for (var j = 0; j < GAMES.length; j++) {
  svcStatus[j] = { cls: 'checking', short: 'Checking server…', long: 'Checking board…' };
}

function paint(i) {
  var st = svcStatus[i];
  document.getElementById('dot-' + i).className = 'dot ' + st.cls;
  document.getElementById('state-' + i).textContent = st.short;
  if (i === sel) { paintHero(); }
}

function paintHero() {
  var g = GAMES[sel], st = svcStatus[sel];
  heroName.innerHTML = '';
  heroName.appendChild(document.createTextNode(g.line1));
  if (g.line2) { heroName.appendChild(document.createElement('br'));
                 heroName.appendChild(document.createTextNode(g.line2)); }
  var longest = Math.max(g.line1.length, (g.line2 || '').length);
  heroName.className = 'hero-name' + (longest > 9 ? ' tiny' : longest > 7 ? ' small' : '');
  heroPill.textContent = st.long;
  heroPill.className = 'pill ' + (st.cls === 'ready' ? 'ready'
                                : st.cls === 'woke' ? 'ready'
                                : st.cls === 'down' ? 'down' : 'waking');
  ctaText.textContent = 'Start ' + g.name;
}

function select(i) {
  sel = ((i % GAMES.length) + GAMES.length) % GAMES.length;
  for (var k = 0; k < GAMES.length; k++) {
    document.getElementById('tile-' + k).className = 'tile' + (k === sel ? ' sel' : '');
  }
  paintHero();
}

function launch(i) {
  window.location.href = GAMES[i].origin + boardPath(GAMES[i]);
}

/* ---- wake + probe every service in parallel ---- */
function probe(i, firstRun) {
  var g = GAMES[i];
  if (firstRun) {
    svcStatus[i] = { cls: 'checking', short: 'Checking server…', long: 'Checking board…' };
    paint(i);
  }
  var t0 = Date.now();
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) { ctrl.abort(); } }, PROBE_TIMEOUT);

  var opts = { mode: 'no-cors', cache: 'no-store', credentials: 'omit' };
  if (ctrl) { opts.signal = ctrl.signal; }

  fetch(g.origin + boardPath(g) + (boardPath(g).indexOf('?') === -1 ? '?' : '&') + 'ping=' + t0, opts)
    .then(function () {
      clearTimeout(timer);
      var ms = Date.now() - t0;
      var secs = Math.round(ms / 1000);
      if (ms > WARM_CUTOFF) {
        svcStatus[i] = { cls: 'woke', short: 'Server awake (' + secs + 's cold start)',
                      long: 'Board ready — woke in ' + secs + 's' };
      } else {
        svcStatus[i] = { cls: 'ready', short: 'Server ready', long: 'Board ready' };
      }
      paint(i);
    })
    .catch(function () {
      clearTimeout(timer);
      svcStatus[i] = { cls: 'down', short: 'No response — check URL',
                    long: 'No response — check the URL or the network' };
      paint(i);
    });
}

function probeAll(firstRun) {
  for (var i = 0; i < GAMES.length; i++) { probe(i, firstRun); }
}
probeAll(true);
setInterval(function () { probeAll(false); }, REPING_EVERY);

/* ---- the yellow OK button is the only thing that launches ---- */
var okBtn = document.getElementById('okBtn');
okBtn.addEventListener('click', function () { launch(sel); });

function flashOk() {
  okBtn.className = 'okkey armed';
  setTimeout(function () { okBtn.className = 'okkey'; }, 180);
}

/* ---- D-pad / keyboard: up-down browses, OK launches ---- */
document.addEventListener('keydown', function (e) {
  var k = e.key, c = e.keyCode;
  if (k === 'ArrowDown' || c === 40) { select(sel + 1); e.preventDefault(); }
  else if (k === 'ArrowUp' || c === 38) { select(sel - 1); e.preventDefault(); }
  else if (k === 'ArrowRight' || c === 39) { select(sel + 1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || c === 37) { select(sel - 1); e.preventDefault(); }
  else if (k === 'Enter' || k === ' ' || c === 13 || c === 32) { flashOk(); launch(sel); e.preventDefault(); }
});

/* ---- scale the 1920x1080 stage to whatever the screen actually is ----
   SAFE_AREA: drop to about 0.92 if an older TV overscans and clips the edges. */
var SAFE_AREA = 1;
(function () {
  var st = document.getElementById('stage');

  function viewport() {
    // Layout viewport in CSS pixels. This is the one that agrees with the
    // viewport meta above; window.innerWidth and visualViewport can both
    // report device pixels on TV browsers and produce a wrong scale.
    var w = document.documentElement.clientWidth;
    var h = document.documentElement.clientHeight;
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    return [w, h];
  }

  function fit() {
    var v = viewport();
    var s = Math.min(v[0] / 1920, v[1] / 1080) * SAFE_AREA;
    if (!isFinite(s) || s <= 0) { s = 1; }
    st.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); }
  window.addEventListener('load', fit);

  // Fire TV reports its real viewport late; re-measure for the first few seconds.
  fit();
  var passes = [50, 250, 600, 1200, 2500, 5000];
  for (var i = 0; i < passes.length; i++) { setTimeout(fit, passes[i]); }
})();

/* ---- repaint on return from a board (bfcache restore) ---- */
window.addEventListener('pageshow', function (e) { if (e.persisted) { probeAll(true); } });

select(0);
</script>

</body>
</html>
